<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хувийн санхүү бүртгэл</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Өөрийн CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="index" class="roboto-regular">

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">

                <div class="card shadow-sm p-4 rounded-4">
                    <div class="card-body">

                        <h3 class="card-title text-center mb-4 fw-bold text-success">
                            <i class="fa-solid fa-sack-dollar text-warning"></i>
                            Хувийн санхүү бүртгэл
                        </h3>

                        <p class="text-muted text-center small mb-4">
                            Нэвтрэх эсвэл шинээр бүртгүүлэх
                        </p>

                        <form id="auth-form">
                            <input 
                                type="email" 
                                id="email"
                                class="form-control mb-3" 
                                placeholder="Имайл хаяг"
                                required
                            >

                            <input 
                                type="password" 
                                id="password"
                                class="form-control mb-3" 
                                placeholder="Нууц үг"
                                required
                            >

                            <button 
                                type="submit" 
                                id="btn-login"
                                class="btn btn-success w-100 mb-2"
                            >
                                Нэвтрэх
                            </button>

                            <button 
                                type="button" 
                                id="btn-register"
                                class="btn btn-outline-success w-100"
                            >
                                Шинээр бүртгүүлэх
                            </button>

                            <div id="message"></div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0c0137132b.js" crossorigin="anonymous"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth JS -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
